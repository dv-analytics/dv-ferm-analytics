[project]
name = "dv-ferm-analytics"
version = "0.1.1"
description = "Reusable Python tools for data analysis, visualization, and automated technical report generation."
authors = [
    {name = "dv-analytics", email = "202854379+dv-analytics@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15,!=3.14.1"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

keywords = [
    "data-analysis",
    "reporting",
    "analytics",
    "word",
    "visualization"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
    "python-docx (>=1.2.0,<2.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "shap (>=0.52.0,<0.53.0)",
    "scipy (>=1.18.1,<2.0.0)"
]

[tool.poetry]
packages = [
    {include = "dv_ferm_analytics", from = "src"}
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
